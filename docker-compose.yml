services:
  peptide-power-assistant:
    build: .
    container_name: peptide-power-assistant
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      PEPTIDE_ADMIN_EMAIL: "admin@example.local"
      PEPTIDE_ADMIN_PASSWORD: "change-me-now"
      PEPTIDE_SECRET: "replace-this-with-a-long-random-string"
      PEPTIDE_DB: "/data/app.db"
    volumes:
      - ./data:/data

